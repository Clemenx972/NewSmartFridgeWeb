<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Outer circle -->
  <circle cx="96" cy="96" r="96" fill="#5558CB"/>
  <!-- Inner circle (neumorphic highlight) -->
  <circle cx="96" cy="96" r="82" fill="#6063D8" opacity="0.55"/>

  <!-- Fridge body -->
  <rect x="54" y="46" width="76" height="108" rx="9" fill="none" stroke="white" stroke-width="4"/>
  <!-- Freezer divider -->
  <line x1="54" y1="86" x2="130" y2="86" stroke="white" stroke-width="4"/>
  <!-- Handle — freezer (top) -->
  <line x1="116" y1="56" x2="116" y2="76" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Handle — fridge (bottom) -->
  <line x1="116" y1="94" x2="116" y2="132" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Checkmark on lower door -->
  <path d="M74 118 l10 10 l20-20" fill="none" stroke="#5EEA8D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Speech bubble — main -->
  <ellipse cx="68" cy="50" rx="18" ry="13" fill="#5EEA8D"/>
  <path d="M60 61 l-3 9 l11-5" fill="#5EEA8D"/>
  <text x="68" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="700" font-family="Arial,sans-serif">ab</text>
  <!-- Bubble — small top right -->
  <circle cx="90" cy="37" r="7" fill="#5EEA8D" opacity="0.75"/>
  <text x="90" y="41" text-anchor="middle" fill="white" font-size="8" font-weight="700" font-family="Arial,sans-serif">c</text>
  <!-- Bubble — tiny left -->
  <circle cx="50" cy="37" r="5" fill="#5EEA8D" opacity="0.6"/>
  <text x="50" y="41" text-anchor="middle" fill="white" font-size="7" font-weight="700" font-family="Arial,sans-serif">o</text>
</svg>
